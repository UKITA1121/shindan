<title>もみじクライマックス投稿サポート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#FBF6F1;--surface:#FFFFFF;--ink:#2B2320;--ink2:#6E615B;--line:#E8DDD5;
--accent:#B93A26;--on-accent:#FFFFFF;--soft:#FBE6DF;--bar:#C8472F;--ok:#2F7D4F;--warn:#9A6400;
--radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#1B1614;--surface:#272019;--ink:#F2E9E4;--ink2:#B3A59D;--line:#40352E;
--accent:#F08A6E;--on-accent:#2B1510;--soft:#43271F;--bar:#E0694D;--ok:#7CCB9A;--warn:#E3B45A;
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#1B1614;--surface:#272019;--ink:#F2E9E4;--ink2:#B3A59D;--line:#40352E;
--accent:#F08A6E;--on-accent:#2B1510;--soft:#43271F;--bar:#E0694D;--ok:#7CCB9A;--warn:#E3B45A;
color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
header.top h1{font-size:17px;font-weight:700}
header.top h1 span{color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs button{flex:1;max-width:144px;background:none;border:0;color:var(--ink2);font:inherit;font-size:11px;padding:8px 0 10px;cursor:pointer}
nav.tabs button b{display:block;font-size:19px;font-weight:400;line-height:1.3}
nav.tabs button.on{color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.card h2{font-size:14px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=month],input[type=number],input[type=url],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{resize:vertical;min-height:96px}
label.f,div.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:10px}
label.f>span,div.f>span{display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--accent)}
.btn.icon{border:0;background:none;font-size:20px;padding:4px 8px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border-radius:28px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chip{display:inline-block;background:var(--soft);color:var(--ink);border-radius:20px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;border:0}
button.chip{cursor:pointer;min-height:28px}
button.chip.line{background:none;border:1px solid var(--line);color:var(--ink2)}
button.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--ink2);background:none}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.tap{cursor:pointer}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.store{font-weight:700;overflow-wrap:anywhere}
.ep{font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs .ph{position:relative}
.thumbs .used{font-size:9px;left:2px;top:2px;padding:0 3px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gal .ph{position:relative}
.used{position:absolute;left:4px;top:4px;background:var(--ok);color:var(--surface);font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;pointer-events:none}
.thumbs img.sel{outline:3px solid var(--accent);outline-offset:1px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.tiles.t4{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
.tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .k{font-size:11px;color:var(--ink2)}
.tile .d{font-size:11px;color:var(--ink2)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink2);min-height:34px}
.seg button.on{background:var(--soft);color:var(--ink);font-weight:700}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);max-width:130px;overflow:hidden;text-overflow:ellipsis}
th{font-size:11px;color:var(--ink2);font-weight:500;cursor:pointer}
th.on{color:var(--accent);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart .read{font-size:12px;color:var(--ink2);min-height:20px}
.chart .read b{color:var(--ink);font-size:14px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--bar);border-radius:5px}
dialog{border:0;background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:100dvh;height:100dvh;margin:0 auto;padding:env(safe-area-inset-top,0px) 0 0}
#ask{height:auto;width:calc(100% - 32px);max-width:360px;margin:auto;border-radius:16px;padding:0}
#ask p{white-space:pre-wrap;margin-bottom:12px}
#ask .row{justify-content:flex-end;margin-top:12px}
@media(min-width:680px){dialog{height:auto;max-height:92dvh;margin:auto;border-radius:16px}}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dhead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);z-index:2}
.dhead h2{font-size:16px}
.dbody{padding:14px 16px 24px}
#viewer{background:#000;color:#fff;max-width:none;height:100dvh;max-height:100dvh}
#viewer img{width:100%;height:100%;object-fit:contain}
#viewer .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
#viewer .cap button{background:#fff;color:#000;border:0}
.empty{text-align:center;color:var(--ink2);padding:28px 12px;font-size:13px}
details.filt summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:4px 0}
.plan{display:flex;gap:12px;align-items:flex-start}
.plan .d{flex:none;width:58px;text-align:center;background:var(--soft);border-radius:10px;padding:6px 0;font-weight:700;line-height:1.3}
.plan .d small{display:block;font-weight:400;font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .w{font-size:11px;color:var(--ink2);padding:2px 0}
.cal button{background:var(--bg);border:1px solid transparent;border-radius:8px;min-height:48px;padding:3px 0;cursor:pointer;font-size:13px;line-height:1.25}
.cal button.today{border-color:var(--ink2)}
.cal button.sel{border-color:var(--accent);background:var(--soft)}
.cal button small{display:block;font-size:10px;min-height:13px;color:var(--accent);letter-spacing:1px}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
ul.ins{list-style:none;font-size:13px}
ul.ins li{padding:5px 0;border-bottom:1px solid var(--line)}
ul.ins li:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:12px;align-items:center;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
<div class="wrap">
  <header class="top"><h1>🍁 <span>もみじクライマックス</span> 投稿サポート</h1><button class="btn icon" data-act="tab" data-k="conf" aria-label="設定">⚙️</button></header>
  <main id="main"><div class="empty">読み込み中…</div></main>
</div>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-k="home"><b>🏠</b>ホーム</button>
  <button data-act="tab" data-k="visits"><b>📒</b>来店</button>
  <button data-act="tab" data-k="posts"><b>✍️</b>投稿</button>
  <button data-act="tab" data-k="stats"><b>📊</b>分析</button>
  <button data-act="tab" data-k="plan"><b>🗓️</b>予定</button>
</nav>
<dialog id="dlg"></dialog>
<dialog id="viewer"><img alt=""><div class="cap"><span id="vcap"></span><span class="row"><button class="btn sm" id="vuse"></button><button class="btn sm" id="vopen">来店を開く</button></span></div></dialog>
<dialog id="ask"><div class="dbody"><p id="askmsg"></p><input type="text" id="askin" autocomplete="off"><div class="row"><button class="btn" data-ask="0">キャンセル</button><button class="btn pri" data-ask="1" id="askok">OK</button></div></div></dialog>
<div id="toast"></div>
<datalist id="dl-area"></datalist><datalist id="dl-store"></datalist><datalist id="dl-cast"></datalist>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const fmt1=n=>(Math.round((n||0)*10)/10).toLocaleString('ja-JP');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const WD=['日','月','火','水','木','金','土'];
const wdOf=s=>new Date(s+'T00:00:00').getDay();
const dlabel=s=>{const[y,m,d]=s.split('-');return `${y}/${+m}/${+d}（${WD[wdOf(s)]}）`};
const mdlabel=s=>{const[,m,d]=s.split('-');return `${+m}/${+d}（${WD[wdOf(s)]}）`};
const daysAgo=s=>Math.round((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/864e5);
const addMonth=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymLabel=ym=>`${ym.slice(0,4)}年${+ym.slice(5)}月`;
const splitList=s=>[...new Set(String(s||'').split(/[,、，\n]/).map(x=>x.trim()).filter(Boolean))];
const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
let undoFn=null;
function toast(m,undo){const t=$('#toast');undoFn=undo||null;t.innerHTML=esc(m)+(undo?'<button data-act="undo">元に戻す</button>':'');t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.classList.remove('on');undoFn=null},undo?6000:1800)}

/* ---------- storage（Claudeのアーティファクト用データベース。本人だけが読める領域に保存） ---------- */
let base=null,ASSETS=null,DL=null;
const STORES=['visits','posts','plans','notes','days'];
const clean=v=>JSON.parse(JSON.stringify(v));
const col=s=>base.collection(s);
async function dbAll(s){const out=[];let last=null;
  for(;;){const q=last===null?col(s).orderBy('_k').limit(500):col(s).where('_k','>',last).orderBy('_k').limit(500);
    const snap=await q.get();snap.docs.forEach(d=>out.push(clean(d.data())));if(snap.size<500)break;last=out[out.length-1]._k}
  return out}
async function dbPut(s,v){if(!v._k)v._k=s==='notes'?uid():v.id;await col(s).doc(v._k).set(clean(v))}
const dbDel=(s,k)=>col(s).doc(k).delete();
async function dbClear(s){for(const d of await dbAll(s))await dbDel(s,d._k)}
function dataBlob(u){const[h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})}
const delAsset=async id=>{try{if(ASSETS)await ASSETS.delete(id)}catch(e){}};
// 確認ダイアログ（この環境では confirm / prompt が使えないため自前で用意）
let askRes=null;
function ask(msg,o={}){$('#askmsg').textContent=msg;const i=$('#askin');i.hidden=o.text===undefined;i.value=o.text||'';$('#askok').textContent=o.ok||'OK';$('#ask').showModal();return new Promise(r=>askRes=r)}
function askDone(ok){if(!askRes)return;const r=askRes,i=$('#askin');askRes=null;$('#ask').close();r(ok?(i.hidden?true:i.value):false)}
$('#ask').addEventListener('click',e=>{const b=e.target.closest('[data-ask]');if(b)askDone(b.dataset.ask==='1')});
$('#ask').addEventListener('cancel',e=>{e.preventDefault();askDone(false)});

const DEF={w:{likes:0,reposts:0,replies:0,imps:1,follows:0},budget:'',goalFollow:'',goalImps:'',followers:[]};
let conf=structuredClone(DEF),confBusy=Promise.resolve();
const saveConf=()=>{const c=clean(conf);confBusy=confBusy.then(()=>base.set({conf:c})).catch(()=>toast('設定を保存できませんでした'))};

/* ---------- state ---------- */
let visits=[],posts=[],plans=[],days=[],notes=new Map();
const F0=()=>({area:'',store:'',cast:'',tag:'',from:'',to:'',unposted:false,photo:false});
const ui={tab:'home',q:'',f:F0(),sort:'date',vseg:'list',pseg:'stock',pq:'',gf:'all',range:'6',dim:'store',tsort:'visits',
  cal:today().slice(0,7),day:today(),planMonth:addMonth(today().slice(0,7),1),showPlan:false};
let byVisit=new Map(),M=null,ORD=new Map(),CNT={store:new Map(),cast:new Map(),cheki:0},USED=new Set();
const WN={imps:'インプレッション',follows:'フォロー増',likes:'いいね',reposts:'リポスト',replies:'返信'};
const scoreLabel=()=>Object.keys(WN).filter(k=>+conf.w[k]).map(k=>`${WN[k]}×${conf.w[k]}`).join('＋')||'（重みが未設定）';
const isMs=n=>n===5||(n>=10&&n%10===0); // 記念になる回数
const score=p=>(+p.likes||0)*conf.w.likes+(+p.reposts||0)*conf.w.reposts+(+p.replies||0)*conf.w.replies+(+p.imps||0)*conf.w.imps+(+p.follows||0)*(conf.w.follows||0);
// 来店の反響 = 紐づく「投稿済」投稿のスコア合計。n=0 は「未評価」（0点ではない）
function react(v){const ps=byVisit.get(v.id)||[];return{n:ps.length,s:sum(ps,score)}}
const K=2; // 少ない実績を全体平均に寄せる強さ
function buildModel(){
  byVisit=new Map();for(const p of posts){if(!p.visitId)continue;if(!byVisit.has(p.visitId))byVisit.set(p.visitId,[]);byVisit.get(p.visitId).push(p)}
  const ev=visits.map(v=>({v,r:react(v)})).filter(x=>x.r.n),g=ev.length?sum(ev,x=>x.r.s)/ev.length:0;
  const mk=fn=>{const m=new Map();for(const x of ev)for(const k of fn(x.v)){const o=m.get(k)||{sum:0,n:0};o.sum+=x.r.s;o.n++;m.set(k,o)}return m};
  const sh=(s,n)=>(s+K*g)/(n+K);
  M={ev,g,sh,store:mk(v=>[v.store]),cast:mk(v=>v.casts),tag:mk(v=>v.tags),wd:mk(v=>[wdOf(v.date)]),photo:mk(v=>[v.photos.length?'あり':'なし']),
    est(map,k){const o=map.get(k);return o?sh(o.sum,o.n):g}};
  // 来店回数・チェキ枚数の通し番号（記念投稿用）
  ORD=new Map();const sc=new Map(),cc=new Map();let ck=0;
  for(const v of [...visits].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))){
    const o={sn:0,cn:{},ca:0,cb:0,ms:[]};
    if(v.store){o.sn=(sc.get(v.store)||0)+1;sc.set(v.store,o.sn);if(isMs(o.sn))o.ms.push(`${v.store} 来店${o.sn}回目`)}
    for(const c of v.casts){const n=(cc.get(c)||0)+1;cc.set(c,n);o.cn[c]=n;if(isMs(n))o.ms.push(`${c} ${n}回目`)}
    if(v.photos.length){o.ca=ck+1;ck+=v.photos.length;o.cb=ck;const k=Math.floor(o.cb/10)*10;if(k>=o.ca)o.ms.push(`チェキ通算${k}枚目`)}
    ORD.set(v.id,o)}
  CNT={store:sc,cast:cc,cheki:ck};USED=new Set(posts.flatMap(p=>p.photoIds||[]));
}
const photoUsed=p=>!!p.used||USED.has(p.id);
const galImg=p=>`<div class="ph"><img src="${p.thumb}" data-act="view" data-id="${p.id}" alt="チェキ" loading="lazy">${photoUsed(p)?'<span class="used">投稿済</span>':''}</div>`;
// 今月の目標の実績（日別データがあればそれを優先）
function goalStat(ym){const ds=days.filter(d=>d.date.startsWith(ym)),ps=posts.filter(p=>(p.date||'').startsWith(ym));
  const imps=ds.length?{v:sum(ds,d=>d.imps||0),src:'日別データ'}:{v:sum(ps,p=>+p.imps||0),src:'投稿の合計'};
  const log=[...(conf.followers||[])].sort((a,b)=>a.date.localeCompare(b.date)),inM=log.filter(x=>x.date.startsWith(ym)),before=log.filter(x=>x.date<ym+'-01').pop();
  let fol;if(ds.some(d=>d.follows!=null))fol={v:sum(ds,d=>(d.follows||0)-(d.unfollows||0)),src:'日別データ'};
  else if(inM.length&&(before||inM.length>1))fol={v:inM[inM.length-1].count-(before||inM[0]).count,src:'フォロワー数の記録'};
  else fol={v:sum(ps,p=>+p.follows||0),src:'投稿経由のフォロー合計'};
  return{imps,fol,now:log.length?log[log.length-1]:null}}
// 来店1件の期待反響（店舗・キャスト・タグの実績から）
function expected(v){const xs=[M.est(M.store,v.store),...v.casts.map(c=>M.est(M.cast,c)),...v.tags.map(t=>M.est(M.tag,t))];return sum(xs,x=>x)/xs.length}
const isStock=v=>!v.skip&&!(byVisit.get(v.id)||[]).length;

function filtered(){
  const toks=ui.q.toLowerCase().split(/\s+/).filter(Boolean),f=ui.f;
  const r=visits.filter(v=>{
    if(f.area&&v.area!==f.area)return false;
    if(f.store&&v.store!==f.store)return false;
    if(f.cast&&!v.casts.includes(f.cast))return false;
    if(f.tag&&!v.tags.includes(f.tag))return false;
    if(f.from&&v.date.slice(0,7)<f.from)return false;
    if(f.to&&v.date.slice(0,7)>f.to)return false;
    if(f.unposted&&!isStock(v))return false;
    if(f.photo&&!v.photos.length)return false;
    if(toks.length){const hay=[v.date,v.area,v.store,v.casts.join(' '),v.episode,v.tags.join(' '),v.amount,(byVisit.get(v.id)||[]).map(p=>p.text).join(' ')].join(' ').toLowerCase();
      if(!toks.every(t=>hay.includes(t)))return false}
    return true});
  const cmp={date:(a,b)=>b.date.localeCompare(a.date),amount:(a,b)=>b.amount-a.amount,react:(a,b)=>react(b).s-react(a).s,old:(a,b)=>a.date.localeCompare(b.date)}[ui.sort];
  return r.sort(cmp);
}

function parseCsv(t){t=t.replace(/^﻿/,'');const first=t.split('\n')[0],sep=first.includes('\t')&&!first.includes(',')?'\t':',';const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function pwhen(s){s=String(s||'').trim();const utc=/(\+0000|Z|GMT|UTC)\s*$/.test(s),d=new Date(s.replace(/^[A-Za-z]{3},\s*/,''));
  if(utc&&!isNaN(d))return{date:ymd(d),time:`${pad(d.getHours())}:${pad(d.getMinutes())}`};
  const m=s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/),t=s.match(/(\d{1,2}):(\d{2})/),time=t?`${pad(t[1])}:${t[2]}`:'';
  if(m)return{date:`${m[1]}-${pad(m[2])}-${pad(m[3])}`,time};return isNaN(d)?{}:{date:ymd(d),time}}
const COLS={id:['post id','tweet id','ポストid','ツイートid','id'],link:['post link','tweet permalink','permalink','ポストのリンク','リンク','url'],text:['post text','tweet text','ポスト本文','ツイート本文','本文','text'],
  date:['date','time','日付','日時','時間'],imps:['impressions','インプレッション数','インプレッション'],likes:['likes','いいね','いいね数'],reposts:['reposts','retweets','リポスト','リツイート','リポスト数'],
  replies:['replies','返信','返信数'],follows:['new follows','follows','新しいフォロー','新規フォロー','フォロー数','フォロー'],unfollows:['unfollows','フォロー解除','フォロー解除数']};
async function importAnalytics(file){
  let rows;try{rows=parseCsv(await file.text()).filter(r=>r.some(x=>x.trim()))}catch(e){return toast('ファイルを読み込めませんでした')}
  if(rows.length<2)return toast('データの行がありません');
  const h=rows[0].map(x=>x.trim()),low=h.map(x=>x.toLowerCase()),c={};for(const[k,names]of Object.entries(COLS)){c[k]=-1;for(const nm of names){const i=low.indexOf(nm);if(i>=0){c[k]=i;break}}}
  const num=(r,k)=>c[k]<0?null:Math.round(+String(r[c[k]]||'').replace(/[,\s]/g,''))||0,body=rows.slice(1),perPost=c.id>=0||c.link>=0||c.text>=0;
  if(c.imps<0||(!perPost&&c.date<0))return ask('この形式は読み取れませんでした。\n\n見出し：'+h.join(' / ')+'\n\nこの見出しをそのままClaudeに伝えると対応できます。',{ok:'閉じる'});
  toast('取り込んでいます…');
  if(!perPost){let n=0;
    for(const r of body){const d=pwhen(r[c.date]).date;if(!d)continue;const o={id:d,date:d,imps:num(r,'imps')||0,follows:num(r,'follows'),unfollows:num(r,'unfollows')};
      const i=days.findIndex(x=>x.id===d);if(i>=0)days[i]=o;else days.push(o);await dbPut('days',o);n++}
    render();return ask(`日別データ ${n}日分を取り込みました。\nホームの「今月の目標」に反映されます。`)}
  const sid=x=>(String(x||'').match(/status\/(\d+)/)||[])[1]||'',norm=x=>String(x||'').replace(/\s+/g,'').slice(0,40);let up=0;const miss=[];
  for(const r of body){const id=(c.id>=0&&String(r[c.id]).replace(/\D/g,''))||(c.link>=0&&sid(r[c.link]))||'',tx=c.text>=0?r[c.text]:'';
    const p=posts.find(p=>id&&(p.xid===id||sid(p.url)===id))||posts.find(p=>tx&&p.text&&norm(p.text)===norm(tx));
    const m={};for(const k of['imps','likes','reposts','replies','follows']){const v=num(r,k);if(v!==null)m[k]=v}
    const w=c.date>=0?pwhen(r[c.date]):{},extra={xid:id,url:c.link>=0?r[c.link].trim():'',text:tx,date:w.date||'',time:w.time||''};
    if(p){Object.assign(p,m);for(const k in extra)if(!p[k]&&extra[k])p[k]=extra[k];await dbPut('posts',p);up++}else miss.push({...m,...extra})}
  render();
  if(!miss.length)return ask(`${up}件の投稿の結果を更新しました。`);
  if(await ask(`${up}件の投稿の結果を更新しました。\n\n記録にない投稿が ${miss.length}件あります。これらも「載せた投稿」として保管しますか？\n（あとで来店と紐づけられます）`,{ok:'保管する'})){
    toast('保管しています…');for(const x of miss){const p={id:uid(),visitId:'',status:'posted',photoIds:[],...x};posts.push(p);await dbPut('posts',p)}render();toast(`${miss.length}件を保管しました`)}
}

/* ---------- 分析 ---------- */
function monthsList(n){const out=[],d=new Date();d.setDate(1);
  const first=visits.length?visits.reduce((a,v)=>v.date<a?v.date:a,'9999').slice(0,7):ymd(d).slice(0,7);
  for(let i=0;i<(n||600);i++){const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;out.unshift(k);if(!n&&k<=first)break;d.setMonth(d.getMonth()-1)}
  return n?out:out.slice(-36)}
function agg(list,keyFn){const m=new Map();
  for(const v of list){const r=react(v);for(const k of keyFn(v)){if(!m.has(k))m.set(k,{key:k,visits:0,spend:0,posts:0,react:0,ev:0,evSpend:0});
    const o=m.get(k);o.visits++;o.spend+=v.amount;o.posts+=r.n;o.react+=r.s;if(r.n){o.ev++;o.evSpend+=v.amount}}}
  return [...m.values()].map(o=>({...o,avg:o.spend/o.visits,per:o.ev?o.react/o.ev:null,eff:o.evSpend?o.react/o.evSpend*1000:null}))}
const band=t=>{if(!t)return'時刻未入力';const h=+t.slice(0,2);return h<5?'深夜（0–5時）':h<11?'朝（5–11時）':h<17?'昼（11–17時）':h<21?'夜（17–21時）':'夜遅く（21–24時）'};
const DIMS={store:['店舗',v=>[v.store||'（未入力）']],cast:['キャスト',v=>v.casts.length?v.casts:['（未入力）']],area:['エリア',v=>[v.area||'（未入力）']],tag:['タグ',v=>v.tags.length?v.tags:['（タグなし）']],wd:['来店曜日',v=>[WD[wdOf(v.date)]+'曜']],
  pwd:['投稿曜日',p=>[WD[wdOf(p.date)]+'曜'],1],ptime:['投稿時間帯',p=>[band(p.time)],1]};
function barChart(title,rows,f){
  const W=340,H=150,L=6,B=20,T=8,max=Math.max(1,...rows.map(r=>r.value)),bw=(W-L*2)/rows.length,ph=H-B-T;
  const step=Math.ceil(rows.length/12);
  const bars=rows.map((r,i)=>{const h=Math.round(r.value/max*ph),x=L+i*bw,w=Math.max(2,Math.min(22,bw-2)),bx=x+(bw-w)/2,y=T+ph-h;const rr=Math.min(4,h,w/2);
    const d=h>0?`M${bx},${T+ph}V${y+rr}Q${bx},${y} ${bx+rr},${y}H${bx+w-rr}Q${bx+w},${y} ${bx+w},${y+rr}V${T+ph}Z`:'';
    return `<g class="b" data-i="${i}">${d?`<path d="${d}" fill="var(--bar)"/>`:''}<rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/>
    ${i%step===0?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink2)">${r.short}</text>`:''}</g>`}).join('');
  const last=rows[rows.length-1];
  return `<div class="card chart" data-chart='${esc(JSON.stringify(rows.map(r=>[r.label,f(r.value)])))}'><h2>${title}</h2>
    <div class="read"><b>${f(last.value)}</b>　${last.label}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}の月別棒グラフ"><line x1="${L}" x2="${W-L}" y1="${T+ph+.5}" y2="${T+ph+.5}" stroke="var(--line)"/>${bars}</svg></div>`;
}
function renderStats(){
  if(!visits.length){$('#main').innerHTML=`<div class="empty">来店記録を追加すると、月別の来店回数・利用額や反響の分析が表示されます。</div>`;return}
  const ms=monthsList(ui.range==='all'?0:+ui.range),from=ms[0];
  const list=visits.filter(v=>v.date.slice(0,7)>=from),A=agg(list,()=>['all'])[0]||{visits:0,spend:0,posts:0,react:0,per:null,eff:null};
  const per=agg(list,v=>[v.date.slice(0,7)]),pm=new Map(per.map(o=>[o.key,o]));
  const rows=k=>ms.map(m=>({label:ymLabel(m),short:`${+m.slice(5)}月`,value:(pm.get(m)||{})[k]||0}));
  const [dl,fn,isPost]=DIMS[ui.dim];let t,cols;const dash=x=>x==null?'<span class="muted">—</span>':fmt1(x);
  if(isPost){const m=new Map();for(const p of posts){if(!p.date||p.date.slice(0,7)<from)continue;for(const k of fn(p)){const o=m.get(k)||{key:k,posts:0,react:0,imps:0};o.posts++;o.react+=score(p);o.imps+=+p.imps||0;m.set(k,o)}}
    t=[...m.values()].map(o=>({...o,per:o.react/o.posts,impavg:o.imps/o.posts}));cols=[['key',dl],['posts','投稿'],['react','反響計'],['per','反響/投稿'],['impavg','平均インプ']];
  }else{t=agg(list,fn);cols=[['key',dl],['visits','来店'],['spend','利用額'],['avg','平均単価'],['posts','投稿'],['react','反響計'],['per','反響/来店'],['eff','反響/千円']]}
  const ts=cols.some(c=>c[0]===ui.tsort)?ui.tsort:cols[1][0];
  t.sort((a,b)=>ts==='key'?a.key.localeCompare(b.key,'ja'):(b[ts]??-1)-(a[ts]??-1));
  if((ui.dim==='wd'||ui.dim==='pwd')&&ts==='key')t.sort((a,b)=>WD.indexOf(a.key[0])-WD.indexOf(b.key[0]));
  const cell=(o,k)=>k==='key'?esc(o.key):['spend','avg'].includes(k)?yen(o[k]):['visits','posts'].includes(k)?o[k]:k==='impavg'?Math.round(o[k]).toLocaleString():dash(o[k]);
  const ent={store:'store',cast:'cast'}[ui.dim];
  $('#main').innerHTML=`
  <div class="seg">${[['3','直近3ヶ月'],['6','6ヶ月'],['12','12ヶ月'],['all','全期間']].map(([k,l])=>`<button data-act="range" data-k="${k}" class="${ui.range===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="tiles t4">
    <div class="tile"><div class="k">来店回数</div><div class="v">${A.visits}<small> 回</small></div><div class="d">月平均 ${fmt1(A.visits/ms.length)}回</div></div>
    <div class="tile"><div class="k">利用額</div><div class="v">${yen(A.spend)}</div><div class="d">月平均 ${yen(A.spend/ms.length)}</div></div>
    <div class="tile"><div class="k">投稿数（投稿済）</div><div class="v">${A.posts}<small> 件</small></div><div class="d">来店の${A.visits?Math.round(list.filter(v=>react(v).n).length/A.visits*100):0}%を投稿化</div></div>
    <div class="tile"><div class="k">来店あたり反響</div><div class="v">${A.per==null?'—':fmt1(A.per)}</div><div class="d">千円あたり ${A.eff==null?'—':fmt1(A.eff)}</div></div>
  </div>
  ${barChart('月別 来店回数',rows('visits'),v=>v+'回')}
  ${barChart('月別 利用額',rows('spend'),yen)}
  ${barChart('月別 反響スコア（来店月ベース）',rows('react'),fmt1)}
  ${barChart('月別 インプレッション',ms.map(m=>({label:ymLabel(m),short:`${+m.slice(5)}月`,value:goalStat(m).imps.v})),v=>Math.round(v).toLocaleString())}
  ${barChart('月別 フォロワー増加',ms.map(m=>({label:ymLabel(m),short:`${+m.slice(5)}月`,value:Math.max(0,goalStat(m).fol.v)})),v=>'+'+Math.round(v).toLocaleString())}
  <div class="card"><h2>内訳</h2>
    <div class="seg">${Object.entries(DIMS).map(([k,[l]])=>`<button data-act="dim" data-k="${k}" class="${ui.dim===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="tblwrap"><table><thead><tr>${cols.map(([k,l])=>`<th data-act="tsort" data-k="${k}" class="${ts===k?'on':''}">${l}${ts===k?' ▾':''}</th>`).join('')}</tr></thead>
    <tbody>${t.map(o=>`<tr ${ent&&!o.key.startsWith('（')?`class="tap" data-act="ent" data-kind="${ent}" data-name="${esc(o.key)}"`:''}>${cols.map(([k])=>`<td class="num">${cell(o,k)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="muted">データがありません</td></tr>`}</tbody></table></div>
    <p class="muted" style="margin-top:8px">反響スコア＝${scoreLabel()}（設定で変更可）。「反響/来店」「反響/千円」は投稿済みの来店だけで計算し、未投稿の来店は0点扱いにしません。${ent?'行をタップすると詳細を開きます。':''}</p>
  </div>`;
}
function chartHover(e){const g=e.target.closest('g.b');if(!g)return;const c=g.closest('.chart'),d=JSON.parse(c.dataset.chart)[+g.dataset.i];
  $('.read',c).innerHTML=`<b>${esc(d[1])}</b>　${esc(d[0])}`;c.querySelectorAll('g.b path').forEach(p=>p.style.opacity=p.parentNode===g?1:.45)}
$('#main').addEventListener('pointerover',chartHover);$('#main').addEventListener('pointerdown',chartHover);

/* ---------- 予定 ---------- */
function castStore(c){const m=new Map();visits.filter(v=>v.casts.includes(c)&&v.store).forEach(v=>m.set(v.store,(m.get(v.store)||0)+1));return[...m].sort((a,b)=>b[1]-a[1])[0]?.[0]||''}
// 手入力のイベント＋キャスト誕生日
function eventsIn(ym){const out=plans.filter(p=>p.type==='event'&&p.date.startsWith(ym)).map(p=>({...p}));
  for(const n of notes.values()){if(!n.id.startsWith('cast:')||!n.birthday||n.birthday.slice(0,2)!==ym.slice(5))continue;const c=n.id.slice(5);
    const date=`${ym}-${n.birthday.slice(3)}`;if(new Date(date+'T00:00:00').getMonth()+1!==+ym.slice(5))continue;
    out.push({id:'b:'+c,type:'event',auto:true,date,title:`${c} 誕生日`,cast:c,store:castStore(c)})}
  return out}
function renderPlan(){

  const d=ui.day,dv=visits.filter(v=>v.date===d),dp=plans.filter(p=>p.type==='plan'&&p.date===d),de=eventsIn(d.slice(0,7)).filter(e=>e.date===d);

`;

async function savePlanForm(f){
  const type=f.dataset.type,store=f.store.value.trim(),vs=visits.filter(v=>v.store===store);
  const p={id:uid(),type,date:f.date.value,store,cast:f.cast.value.trim(),area:vs[0]?.area||''};
  if(type==='event')p.title=f.title.value.trim();else{p.est=f.est.value!==''?+f.est.value:(vs.length?Math.round(sum(vs,v=>v.amount)/vs.length):0);p.memo=f.memo.value.trim()}
  plans.push(p);await dbPut('plans',p);closeDlg(true);go('plan',{day:p.date,cal:p.date.slice(0,7)});toast('追加しました');
}

    <div class="row"><button class="btn" data-act="sample">サンプルデータを追加</button>${ns?`<button class="btn" data-act="wipe-sample">サンプルだけ削除</button>`:''}<button class="btn danger" data-act="wipe">全データを削除</button></div></div>`;
}
async function download(name,text){try{await DL.save({filename:name,data:text});return true}catch(e){if(!e||e.code!=='declined')toast('保存できませんでした');return false}}
async function exportAll(){
  const data={app:'momiji-climax',version:3,exported:new Date().toISOString(),conf,visits,posts,plans,days,notes:[...notes.values()]};
  if(await download(`momiji-backup-${today()}.json`,JSON.stringify(data))){conf.lastBackup=today();saveConf();render()}
}
function exportCsv(kind){
  const q=x=>`"${String(x??'').replace(/"/g,'""')}"`;let rows;
  if(kind==='visits')rows=[['来店日','エリア','店舗','キャスト','利用額','出来事','タグ','投稿数','反響'],...[...visits].sort((a,b)=>a.date.localeCompare(b.date)).map(v=>{const r=react(v);return[v.date,v.area,v.store,v.casts.join('、'),v.amount,v.episode,v.tags.join('、'),r.n,r.s]})];
  else rows=[['投稿日','時刻','状態','店舗','本文','URL','いいね','リポスト','返信','インプレッション','反響スコア'],...[...posts].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(p=>[p.date,p.time,'投稿済',visits.find(v=>v.id===p.visitId)?.store,p.text,p.url,p.likes,p.reposts,p.replies,p.imps,score(p)])];
  download(`momiji-${kind}-${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'));
}
async function importAll(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast('ファイルを読み込めませんでした');return}
  if(d.app!=='momiji-climax'||!Array.isArray(d.visits)){toast('このアプリのバックアップファイルではありません');return}
  if(!await ask(`来店 ${d.visits.length}件・投稿 ${(d.posts||[]).length}件を読み込みます。\n同じ記録は上書きされ、それ以外の既存データは残ります。よろしいですか？`,{ok:'読み込む'}))return;
  toast('読み込んでいます…');for(const s of STORES)for(const x of d[s]||[]){if(s==='notes'){const o=notes.get(x.id);if(o)x._k=o._k}await dbPut(s,x)}
  if(d.conf){conf={...DEF,...d.conf,w:{...DEF.w,...(d.conf.w||{})}};saveConf()}
  await load();render();toast('読み込みました');
}
async function addSample(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const S=[['サンプル店A','エリア1',['キャストあ','キャストい'],6000,60],['サンプル店B','エリア1',['キャストう'],12000,75],['サンプル店C','エリア2',['キャストえ','キャストお'],4000,30],['サンプル店D','エリア3',['キャストか'],8000,45]];
  const now=new Date();
  toast('サンプルを追加しています…');for(let i=0;i<24;i++){
    const d=new Date(now);d.setDate(d.getDate()-Math.floor(rnd()*240)-1);
    const k=i<2?3:Math.floor(rnd()*3),s=S[k],date=ymd(d),wk=[0,6].includes(d.getDay())?1.4:1,ev=rnd()<.25;
    const v={id:uid(),date,store:s[0],area:s[1],casts:[s[2][Math.floor(rnd()*s[2].length)]],amount:Math.round(s[3]*(.6+rnd()*.9)/500)*500,
      episode:'（サンプル）当日の出来事メモ',tags:ev?['イベント']:[],photos:[],sample:true};
    await dbPut('visits',v);
    if(rnd()<.75){const base=s[4]*wk*(ev?1.5:1)*(.5+rnd());
      await dbPut('posts',{id:uid(),visitId:v.id,status:'posted',date,time:`${pad(8+Math.floor(rnd()*15))}:00`,text:'（サンプル）投稿本文',url:'',likes:Math.round(base*.7),reposts:Math.round(base*.1),replies:Math.round(base*.05),imps:Math.round(base*40),follows:Math.round(base*.03),photoIds:[],sample:true})}
  }
  await load();render();toast('サンプルデータを追加しました');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,D=el.dataset;
  if(a==='undo'){const f=undoFn;undoFn=null;$('#toast').classList.remove('on');return f&&f()}
  if(a==='tab')return go(D.k);
  if(a==='goto')return go(D.tab,{pseg:D.seg});
  if(a==='view')return openViewer(id);
  if(a==='view-form'){const p=form.photos[+D.i];return openViewer(p.id,p.data)}
  if(a==='new-visit')return openVisit(null,D.d?{date:D.d}:null,true);
  if(a==='more'){document.querySelectorAll('#vform [data-more]').forEach(x=>x.hidden=false);form.quick=false;return el.remove()}
  if(a==='edit-visit')return openVisit(id);
  if(a==='dup-visit'){const v=visits.find(x=>x.id===id);return openVisit(null,{store:v.store,area:v.area,casts:v.casts,amount:v.amount,tags:[]})}
  if(a==='close')return closeDlg();
  if(a==='amt'){const f=$('#vform');f.amount.value=+D.n?(+f.amount.value||0)+ +D.n:'';dirty=true;return}
  if(a==='pick-store'){const f=$('#vform');f.store.value=D.name;f.area.value='';fillArea(f);dirty=true;return drawCastChips()}
  if(a==='rm-photo'){const[p]=form.photos.splice(+D.i,1);if(!p.data)form.removed.push(p.id);dirty=true;return drawFormThumbs()}
  if(a==='add-cast'){const f=$('#vform');f.casts.value=[...splitList(f.casts.value),D.c].join('、');dirty=true;return drawCastChips()}
  if(a==='add-tag'){const f=$('#vform');f.tags.value=[...splitList(f.tags.value),D.c].join('、');dirty=true;return drawCastChips()}
  if(a==='del-visit'){if(!await ask('この来店記録を削除しますか？',{ok:'削除'}))return;
    const v=visits.find(x=>x.id===id),linked=posts.filter(p=>p.visitId===id);
    for(const p of linked){p.visitId='';await dbPut('posts',p)}
    await dbDel('visits',id);visits=visits.filter(x=>x.id!==id);closeDlg(true);render();
    // 写真は「元に戻す」の猶予が過ぎてから消す
    const purge=setTimeout(async()=>{for(const p of v.photos)await delAsset(p.id)},7000);
    return toast('削除しました',async()=>{clearTimeout(purge);await dbPut('visits',v);visits.push(v);for(const p of linked){p.visitId=id;await dbPut('posts',p)}render()})}
  if(a==='skip'){const v=visits.find(x=>x.id===id);v.skip=true;await dbPut('visits',v);render();return toast('ネタ在庫から外しました',async()=>{v.skip=false;await dbPut('visits',v);render()})}
  if(a==='new-post')return openPost(null,id);
  if(a==='edit-post')return openPost(id);
  if(a==='del-post'){if(!await ask('この投稿を削除しますか？',{ok:'削除'}))return;const p=posts.find(x=>x.id===id);await dbDel('posts',id);posts=posts.filter(x=>x.id!==id);closeDlg(true);render();
    return toast('削除しました',async()=>{await dbPut('posts',p);posts.push(p);render()})}
  if(a==='copy'){try{await navigator.clipboard.writeText($('#pform').text.value);toast('コピーしました')}catch(_){$('#pform').text.select();toast('本文を選択しました。そのままコピーしてください')}return}
  if(a==='vseg'){ui.vseg=D.k;return render()}
  if(a==='gf'){ui.gf=D.k;return drawVisitList()}
  if(a==='pp'){formP.has(id)?formP.delete(id):formP.add(id);el.classList.toggle('sel');dirty=true;return}
  if(a==='fol-rec'){const n=Math.round(+$('#fnow').value);if(!(n>=0)||$('#fnow').value==='')return toast('フォロワー数を入力してください');
    conf.followers=[...(conf.followers||[]).filter(x=>x.date!==today()),{date:today(),count:n}];saveConf();render();return toast('記録しました')}
  if(a==='pseg'){ui.pseg=D.k;return render()}
  if(a==='range'){ui.range=D.k;return render()}
  if(a==='dim'){ui.dim=D.k;return render()}
  if(a==='tsort'){ui.tsort=D.k;return render()}
  if(a==='qf'){const f=ui.f,ym=today().slice(0,7);if(D.k==='month'){const on=f.from===ym&&f.to===ym;f.from=f.to=on?'':ym}else f[D.k]=!f[D.k];return render()}
  if(a==='unf'){ui.f[D.k]='';return render()}
  if(a==='ftag'){ui.f.tag=D.name;return go('visits',{vseg:'list'})}
  if(a==='clear-filter'){ui.f=F0();ui.q='';return render()}
  if(a==='ent')return openEntity(D.kind,D.name);
  if(a==='ent-list'){closeDlg(true);ui.f=F0();ui.q='';ui.f[D.kind]=D.name;return go('visits',{vseg:'list'})}
  if(a==='ent-plan')return openPlanForm('plan',today(),D.kind==='cast'?{cast:D.name,store:castStore(D.name)}:{store:D.name});
  if(a==='rename')return renameEntity(D.kind,D.name);
  if(a==='cal'){ui.cal=addMonth(ui.cal,+D.n);return render()}
  if(a==='day'){ui.day=D.d;ui.cal=D.d.slice(0,7);return render()}
  if(a==='new-plan')return openPlanForm('plan',D.d);
  if(a==='new-event')return openPlanForm('event',D.d);
  if(a==='del-plan'){const p=plans.find(x=>x.id===id);await dbDel('plans',id);plans=plans.filter(x=>x.id!==id);render();return toast('取り消しました',async()=>{await dbPut('plans',p);plans.push(p);render()})}
  if(a==='plan-rec'){const p=plans.find(x=>x.id===id);return openVisit(null,{date:p.date,store:p.store,area:p.area,casts:p.cast?[p.cast]:[],planId:p.id})}
  if(a==='export')return exportAll();
  if(a==='csv')return exportCsv(D.k);
  if(a==='sample')return addSample();
  if(a==='wipe-sample'){if(!await ask('サンプルデータだけを削除します。よろしいですか？',{ok:'削除'}))return;
    for(const v of visits.filter(v=>v.sample))await dbDel('visits',v.id);for(const p of posts.filter(p=>p.sample))await dbDel('posts',p.id);await load();render();return toast('サンプルを削除しました')}
  if(a==='wipe'){if(!await ask('すべての来店記録・投稿・予定・写真を削除します。元に戻せません。よろしいですか？',{ok:'すべて削除'}))return;
    toast('削除しています…');for(const v of visits)for(const p of v.photos)await delAsset(p.id);for(const s of STORES)await dbClear(s);await load();render();return toast('削除しました')}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='vform')saveVisit(f);if(f.id==='pform')savePost(f);if(f.id==='plform')savePlanForm(f)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){ui.q=t.value;return drawVisitList()}
  if(t.id==='pq'){ui.pq=t.value;return drawPostList()}
  if(['store','casts','tags'].includes(t.name)&&t.form?.id==='vform')return drawCastChips();
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.f){ui.f[t.dataset.f]=t.value;return render()}
  if(t.id==='sort'){ui.sort=t.value;return drawVisitList()}
  if(t.name==='store'&&t.form?.id==='vform')return fillArea(t.form);
  if(t.name==='visitId')return drawPostVisit();
  if(t.id==='fphoto'){for(const file of t.files){try{const img=await loadImg(file);form.photos.push({id:uid(),thumb:shrink(img,200,.6),data:shrink(img,1280,.82)})}catch(_){toast('読み込めない画像がありました')}}t.value='';dirty=true;return drawFormThumbs()}
  if(t.dataset.note){const box=t.closest('[data-ent]'),n={...note(box.dataset.ent)},g=k=>$(`[data-note=${k}]`,box);
    n.memo=g('memo').value.trim();if(g('oshi')){n.oshi=g('oshi').checked;const bm=+g('bm').value,bd=+g('bd').value;n.birthday=bm>=1&&bm<=12&&bd>=1&&bd<=31?`${pad(bm)}-${pad(bd)}`:''}
    await saveNote(n);dirty=false;render();return toast('メモを保存しました')}
  if(t.id==='pl-b'){conf.budget=t.value;saveConf();return render()}
  if(t.id==='g-fol'){conf.goalFollow=t.value;return saveConf()}
  if(t.id==='g-imp'){conf.goalImps=t.value;return saveConf()}
  if(t.id==='ana'&&t.files[0]){const f=t.files[0];t.value='';return importAnalytics(f)}
  if(t.dataset.w){conf.w[t.dataset.w]=Math.max(0,+t.value||0);return saveConf()}
  if(t.id==='imp'&&t.files[0]){await importAll(t.files[0]);t.value=''}
});

/* ---------- boot ---------- */
async function load(){
  const[v,p,pl,n,c,dy]=await Promise.all([dbAll('visits'),dbAll('posts'),dbAll('plans'),dbAll('notes'),base.get(),dbAll('days')]);
  visits=v;posts=p;plans=pl;days=dy;notes=new Map(n.map(x=>[x.id,x]));
  const cf=c.exists&&c.data().conf;if(cf){const o=clean(cf);conf={...DEF,...o,w:{...DEF.w,...(o.w||{})}}}
  visits.forEach(v=>{v.casts||=[];v.tags||=[];v.photos||=[];v.amount=+v.amount||0})}
let ready=false,loadedAt=0;
const fail=m=>{$('#main').innerHTML=`<div class="empty">${m}</div>`};
(async()=>{
  const slow=setTimeout(()=>{if(!ready)fail('データにまだ接続できません。通信状況を確認して、しばらく待ってから開き直してください。')},10000);
  try{
    if(!window.claude||!claude.use)throw 0;
    const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);const id=u&&await u.id();
    if(!d||!id)throw 0;
    base=d.doc('data/users/'+id+'/app');
    claude.use('assets').then(x=>ASSETS=x);claude.use('downloads').then(x=>{DL=x;if(ready&&ui.tab==='conf')render()});
    await load();ready=true;loadedAt=Date.now();clearTimeout(slow);render();
  }catch(err){clearTimeout(slow);if(err)console.error(err);fail('データを読み込めませんでした。Claudeにサインインした状態で開いてください。')}
})();
addEventListener('unhandledrejection',e=>{console.error(e.reason);toast(e.reason&&e.reason.code==='quota_exceeded'?'保存できる上限に達しました':'保存できませんでした。通信状況を確認してください')});
// 別の端末で更新したあとに戻ってきたら読み直す
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!ready||$('#dlg').open||Date.now()-loadedAt<60000)return;try{await load();loadedAt=Date.now();render()}catch(e){}});
</script>
