<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B93A26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>もみじクライマックス 投稿サポート</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#FBF6F1;--surface:#FFFFFF;--ink:#2B2320;--ink2:#6E615B;--line:#E8DDD5;
--accent:#B93A26;--on-accent:#FFFFFF;--soft:#FBE6DF;--bar:#C8472F;--ok:#2F7D4F;--warn:#9A6400;
--radius:12px;
}
@media (prefers-color-scheme:dark){:root{
--bg:#1B1614;--surface:#272019;--ink:#F2E9E4;--ink2:#B3A59D;--line:#40352E;
--accent:#F08A6E;--on-accent:#2B1510;--soft:#43271F;--bar:#E0694D;--ok:#7CCB9A;--warn:#E3B45A;
}}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
header.top h1{font-size:17px;font-weight:700}
header.top h1 span{color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;max-width:144px;background:none;border:0;color:var(--ink2);font:inherit;font-size:11px;padding:8px 0 10px;cursor:pointer}
nav.tabs button b{display:block;font-size:19px;font-weight:400;line-height:1.3}
nav.tabs button.on{color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.card h2{font-size:14px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=month],input[type=number],input[type=url],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{resize:vertical;min-height:96px}
label.f,div.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:10px}
label.f>span,div.f>span{display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--accent)}
.btn.icon{border:0;background:none;font-size:20px;padding:4px 8px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border-radius:28px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chip{display:inline-block;background:var(--soft);color:var(--ink);border-radius:20px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;border:0}
button.chip{cursor:pointer;min-height:28px}
button.chip.line{background:none;border:1px solid var(--line);color:var(--ink2)}
button.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--ink2);background:none}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.tap{cursor:pointer}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.store{font-weight:700;overflow-wrap:anywhere}
.ep{font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs .ph{position:relative}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.tiles.t4{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
.tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .k{font-size:11px;color:var(--ink2)}
.tile .d{font-size:11px;color:var(--ink2)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink2);min-height:34px}
.seg button.on{background:var(--soft);color:var(--ink);font-weight:700}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);max-width:130px;overflow:hidden;text-overflow:ellipsis}
th{font-size:11px;color:var(--ink2);font-weight:500;cursor:pointer}
th.on{color:var(--accent);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart .read{font-size:12px;color:var(--ink2);min-height:20px}
.chart .read b{color:var(--ink);font-size:14px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--bar);border-radius:5px}
dialog{border:0;background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:100dvh;height:100dvh;margin:0 auto;padding:0}
@media(min-width:680px){dialog{height:auto;max-height:92dvh;margin:auto;border-radius:16px}}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dhead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);z-index:2}
.dhead h2{font-size:16px}
.dbody{padding:14px 16px 24px}
#viewer{background:#000;color:#fff;max-width:none;height:100dvh;max-height:100dvh}
#viewer img{width:100%;height:100%;object-fit:contain}
#viewer .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
#viewer .cap button{background:#fff;color:#000;border:0}
.empty{text-align:center;color:var(--ink2);padding:28px 12px;font-size:13px}
details.filt summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:4px 0}
.plan{display:flex;gap:12px;align-items:flex-start}
.plan .d{flex:none;width:58px;text-align:center;background:var(--soft);border-radius:10px;padding:6px 0;font-weight:700;line-height:1.3}
.plan .d small{display:block;font-weight:400;font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .w{font-size:11px;color:var(--ink2);padding:2px 0}
.cal button{background:var(--bg);border:1px solid transparent;border-radius:8px;min-height:48px;padding:3px 0;cursor:pointer;font-size:13px;line-height:1.25}
.cal button.today{border-color:var(--ink2)}
.cal button.sel{border-color:var(--accent);background:var(--soft)}
.cal button small{display:block;font-size:10px;min-height:13px;color:var(--accent);letter-spacing:1px}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
ul.ins{list-style:none;font-size:13px}
ul.ins li{padding:5px 0;border-bottom:1px solid var(--line)}
ul.ins li:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:12px;align-items:center;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>🍁 <span>もみじクライマックス</span> 投稿サポート</h1><button class="btn icon" data-act="tab" data-k="conf" aria-label="設定">⚙️</button></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-k="home"><b>🏠</b>ホーム</button>
  <button data-act="tab" data-k="visits"><b>📒</b>来店</button>
  <button data-act="tab" data-k="posts"><b>✍️</b>投稿</button>
  <button data-act="tab" data-k="stats"><b>📊</b>分析</button>
  <button data-act="tab" data-k="plan"><b>🗓️</b>予定</button>
</nav>
<dialog id="dlg"></dialog>
<dialog id="viewer"><img alt=""><div class="cap"><span id="vcap"></span><button class="btn sm" id="vopen">来店を開く</button></div></dialog>
<div id="toast"></div>
<datalist id="dl-area"></datalist><datalist id="dl-store"></datalist><datalist id="dl-cast"></datalist>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const fmt1=n=>(Math.round((n||0)*10)/10).toLocaleString('ja-JP');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const WD=['日','月','火','水','木','金','土'];
const wdOf=s=>new Date(s+'T00:00:00').getDay();
const dlabel=s=>{const[y,m,d]=s.split('-');return `${y}/${+m}/${+d}（${WD[wdOf(s)]}）`};
const mdlabel=s=>{const[,m,d]=s.split('-');return `${+m}/${+d}（${WD[wdOf(s)]}）`};
const daysAgo=s=>Math.round((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/864e5);
const addMonth=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymLabel=ym=>`${ym.slice(0,4)}年${+ym.slice(5)}月`;
const splitList=s=>[...new Set(String(s||'').split(/[,、，\n]/).map(x=>x.trim()).filter(Boolean))];
const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
let undoFn=null;
function toast(m,undo){const t=$('#toast');undoFn=undo||null;t.innerHTML=esc(m)+(undo?'<button data-act="undo">元に戻す</button>':'');t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.classList.remove('on');undoFn=null},undo?6000:1800)}

/* ---------- storage ---------- */
let db;
const STORES=['visits','posts','photos','plans','notes'];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('momiji-climax',2);
  r.onupgradeneeded=()=>{for(const s of STORES)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const q=fn(t.objectStore(store));
  t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbGet=(s,id)=>tx(s,'readonly',o=>o.get(id));
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
const dbClear=s=>tx(s,'readwrite',o=>o.clear());

const DEF={w:{likes:1,reposts:2,replies:2,imps:0},hashtags:'',budget:'',target:'',ngWd:[]};
let conf=structuredClone(DEF);
try{const c=JSON.parse(localStorage.getItem('momiji-conf')||'{}');conf={...DEF,...c,w:{...DEF.w,...(c.w||{})}}}catch(e){}
const saveConf=()=>{try{localStorage.setItem('momiji-conf',JSON.stringify(conf))}catch(e){}};

/* ---------- state ---------- */
let visits=[],posts=[],plans=[],notes=new Map();
const F0=()=>({area:'',store:'',cast:'',tag:'',from:'',to:'',unposted:false,photo:false});
const ui={tab:'home',q:'',f:F0(),sort:'date',vseg:'list',pseg:'stock',range:'6',dim:'store',tsort:'visits',
  cal:today().slice(0,7),day:today(),planMonth:addMonth(today().slice(0,7),1),showPlan:false};
let byVisit=new Map(),M=null;
const score=p=>(+p.likes||0)*conf.w.likes+(+p.reposts||0)*conf.w.reposts+(+p.replies||0)*conf.w.replies+(+p.imps||0)*conf.w.imps;
// 来店の反響 = 紐づく「投稿済」投稿のスコア合計。n=0 は「未評価」（0点ではない）
function react(v){const ps=(byVisit.get(v.id)||[]).filter(p=>p.status==='posted');return{n:ps.length,s:sum(ps,score)}}
const K=2; // 少ない実績を全体平均に寄せる強さ
function buildModel(){
  byVisit=new Map();for(const p of posts){if(!p.visitId)continue;if(!byVisit.has(p.visitId))byVisit.set(p.visitId,[]);byVisit.get(p.visitId).push(p)}
  const ev=visits.map(v=>({v,r:react(v)})).filter(x=>x.r.n),g=ev.length?sum(ev,x=>x.r.s)/ev.length:0;
  const mk=fn=>{const m=new Map();for(const x of ev)for(const k of fn(x.v)){const o=m.get(k)||{sum:0,n:0};o.sum+=x.r.s;o.n++;m.set(k,o)}return m};
  const sh=(s,n)=>(s+K*g)/(n+K);
  M={ev,g,sh,store:mk(v=>[v.store]),cast:mk(v=>v.casts),tag:mk(v=>v.tags),wd:mk(v=>[wdOf(v.date)]),photo:mk(v=>[v.photos.length?'あり':'なし']),
    est(map,k){const o=map.get(k);return o?sh(o.sum,o.n):g}};
}
// 来店1件の期待反響（店舗・キャスト・タグの実績から）
function expected(v){const xs=[M.est(M.store,v.store),...v.casts.map(c=>M.est(M.cast,c)),...v.tags.map(t=>M.est(M.tag,t))];return sum(xs,x=>x)/xs.length}
const isStock=v=>!v.skip&&!(byVisit.get(v.id)||[]).length;
const noMetrics=p=>p.status==='posted'&&!(+p.likes||+p.reposts||+p.replies||+p.imps);
const note=id=>notes.get(id)||{id};
async function saveNote(n){notes.set(n.id,n);await dbPut('notes',n)}

/* ---------- photos ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
function shrink(img,max,q){const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function openViewer(id,pending){let d=pending;if(!d){const r=await dbGet('photos',id);d=r&&r.data}if(!d)return;
  const v=visits.find(x=>x.photos.some(p=>p.id===id));$('#viewer img').src=d;
  $('#vcap').textContent=v?`${dlabel(v.date)} ${v.store} ${v.casts.join('、')}`:'';$('#vopen').hidden=!v||$('#dlg').open;$('#vopen').dataset.id=v?v.id:'';$('#viewer').showModal()}
$('#viewer').addEventListener('click',e=>{$('#viewer').close();if(e.target.id==='vopen')openVisit(e.target.dataset.id)});

/* ---------- render root ---------- */
function render(){
  buildModel();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===ui.tab));
  const dl=(id,a)=>$(id).innerHTML=uniq(a).map(x=>`<option value="${esc(x)}">`).join('');
  dl('#dl-area',visits.map(v=>v.area));dl('#dl-store',visits.map(v=>v.store));dl('#dl-cast',visits.flatMap(v=>v.casts));
  ({home:renderHome,visits:renderVisits,posts:renderPosts,stats:renderStats,plan:renderPlan,conf:renderConf})[ui.tab]();
}
const go=(tab,patch)=>{ui.tab=tab;Object.assign(ui,patch||{});render();scrollTo(0,0)};
const chips=(arr,kind)=>arr.map(c=>`<button type="button" class="chip" data-act="ent" data-kind="${kind}" data-name="${esc(c)}">${esc(c)}</button>`).join('');

/* ---------- ホーム ---------- */
function monthStat(ym){const l=visits.filter(v=>v.date.startsWith(ym));return{n:l.length,spend:sum(l,v=>v.amount),react:sum(l,v=>react(v).s)}}
function insights(){
  if(M.ev.length<5||!M.g)return[];const out=[];
  const scan=(label,map,name=k=>k)=>{for(const[k,o]of map){if(!k&&k!==0||o.n<2)continue;const d=M.sh(o.sum,o.n)/M.g-1;if(Math.abs(d)>=.12)out.push({d,t:`${label}「${esc(name(k))}」は来店あたり反響 ${fmt1(o.sum/o.n)}（${o.n}回・全体平均比 ${d>0?'+':''}${Math.round((o.sum/o.n/M.g-1)*100)}%）`})}};
  scan('店舗',M.store);scan('キャスト',M.cast);scan('タグ',M.tag);scan('来店曜日',M.wd,k=>WD[k]+'曜');scan('チェキ',M.photo);
  const up=out.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,3),dn=out.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,2);
  return[...up.map(x=>'📈 '+x.t),...dn.map(x=>'📉 '+x.t)];
}
function upcoming(){const td=today();return plans.filter(p=>p.date>=td).sort((a,b)=>a.date.localeCompare(b.date))}
function renderHome(){
  const ym=today().slice(0,7),a=monthStat(ym),b=monthStat(addMonth(ym,-1)),td=today();
  const due=plans.filter(p=>p.type==='plan'&&p.date<=td).sort((x,y)=>x.date.localeCompare(y.date));
  const nm=posts.filter(noMetrics),stock=visits.filter(isStock).sort((x,y)=>expected(y)-expected(x));
  const next=upcoming().filter(p=>p.date>td).slice(0,3);
  const planned=sum(plans.filter(p=>p.type==='plan'&&p.date.startsWith(ym)),p=>+p.est||0),bud=+conf.budget||0;
  const stores=agg(visits.filter(v=>v.store),v=>[v.store]).map(o=>({...o,last:visits.filter(v=>v.store===o.key).reduce((m,v)=>v.date>m?v.date:m,'')}))
    .filter(o=>o.visits>=2&&daysAgo(o.last)>=45).sort((x,y)=>M.est(M.store,y.key)-M.est(M.store,x.key)).slice(0,3);
  const ins=insights();
  const todo=[
    ...due.map(p=>`<div class="todo"><div class="grow"><b>${p.date===td?'今日の予定':'記録待ちの予定'}</b>：${esc(p.store)} <span class="muted">${mdlabel(p.date)}${p.cast?'・'+esc(p.cast):''}</span></div><button class="btn sm pri" data-act="plan-rec" data-id="${p.id}">記録する</button><button class="btn sm" data-act="del-plan" data-id="${p.id}">取消</button></div>`),

/* ---------- 来店 ---------- */
function filtered(){
  const toks=ui.q.toLowerCase().split(/\s+/).filter(Boolean),f=ui.f;
  const r=visits.filter(v=>{
    if(f.area&&v.area!==f.area)return false;
    if(f.store&&v.store!==f.store)return false;
    if(f.cast&&!v.casts.includes(f.cast))return false;
    if(f.tag&&!v.tags.includes(f.tag))return false;
    if(f.from&&v.date.slice(0,7)<f.from)return false;
    if(f.to&&v.date.slice(0,7)>f.to)return false;
    if(f.unposted&&!isStock(v))return false;
    if(f.photo&&!v.photos.length)return false;
    if(toks.length){const hay=[v.date,v.area,v.store,v.casts.join(' '),v.episode,v.tags.join(' '),v.amount,(byVisit.get(v.id)||[]).map(p=>p.text).join(' ')].join(' ').toLowerCase();
      if(!toks.every(t=>hay.includes(t)))return false}
    return true});
  const cmp={date:(a,b)=>b.date.localeCompare(a.date),amount:(a,b)=>b.amount-a.amount,react:(a,b)=>react(b).s-react(a).s,old:(a,b)=>a.date.localeCompare(b.date)}[ui.sort];
  return r.sort(cmp);
}
function visitCard(v,extra=''){
  const r=react(v),ps=byVisit.get(v.id)||[];
  const st=r.n?`<span class="badge ok">投稿済 ${r.n}・反響 ${fmt1(r.s)}</span>`:ps.length?`<span class="badge">下書きあり</span>`:v.skip?`<span class="badge">投稿しない</span>`:`<span class="badge warn">未投稿</span>`;
  return `<div class="card tap" data-act="edit-visit" data-id="${v.id}">
    <div class="hd"><span class="muted">${dlabel(v.date)}</span><span class="num"><b>${yen(v.amount)}</b></span></div>
    <div class="store">${esc(v.store||'（店舗未入力）')} <span class="muted">${esc(v.area)}</span></div>
    <div>${chips(v.casts,'cast')}${v.tags.map(t=>`<button class="badge" data-act="ftag" data-name="${esc(t)}">#${esc(t)}</button> `).join('')}</div>
    ${v.episode?`<div class="ep">${esc(v.episode)}</div>`:''}
    ${v.photos.length?`<div class="thumbs">${v.photos.map(p=>`<img src="${p.thumb}" data-act="view" data-id="${p.id}" alt="チェキ" loading="lazy">`).join('')}</div>`:''}
    <div class="row between" style="margin-top:8px">${st}${extra}</div></div>`;
}

        <div class="f"><span>&nbsp;</span><button class="btn" data-act="clear-filter" style="width:100%">すべてクリア</button></div>

function drawVisitList(){
  const box=$('#vlist');if(!box)return;
  if(ui.vseg==='cast'||ui.vseg==='store'){
    const kind=ui.vseg,rows=agg(visits,kind==='cast'?v=>v.casts:v=>v.store?[v.store]:[]).sort((a,b)=>b.visits-a.visits);
    box.innerHTML=rows.length?rows.map(o=>{const n=note(kind+':'+o.key),last=visits.filter(v=>kind==='cast'?v.casts.includes(o.key):v.store===o.key).reduce((m,v)=>v.date>m?v.date:m,'');
      return `<div class="card tap" data-act="ent" data-kind="${kind}" data-name="${esc(o.key)}"><div class="hd"><span class="store">${n.oshi?'💗 ':''}${esc(o.key)}</span><span class="num"><b>${yen(o.spend)}</b></span></div>
      <div class="muted">来店 ${o.visits}回・最終 ${daysAgo(last)}日前・反響/来店 ${o.per==null?'—':fmt1(o.per)}${n.birthday?`・🎂 ${+n.birthday.slice(0,2)}/${+n.birthday.slice(3)}`:''}</div></div>`}).join(''):`<div class="empty">来店を記録すると、${kind==='cast'?'キャスト':'店舗'}ごとのまとめが表示されます。</div>`;
    return}
  const r=filtered();
  const head=`<p class="muted" style="margin:0 2px 8px">${r.length}件・合計 ${yen(sum(r,v=>v.amount))}</p>`;
  if(ui.vseg==='gal'){const ph=r.flatMap(v=>v.photos);
    box.innerHTML=ph.length?`<p class="muted" style="margin:0 2px 8px">写真 ${ph.length}枚</p><div class="gal">${ph.map(p=>`<img src="${p.thumb}" data-act="view" data-id="${p.id}" alt="チェキ" loading="lazy">`).join('')}</div>`:`<div class="empty">条件に合う写真がありません。</div>`;return}
  box.innerHTML=head+(r.length?r.map(v=>visitCard(v)).join(''):`<div class="empty">${visits.length?'条件に合う来店記録がありません。':'まだ来店記録がありません。<br>右下の「＋ 来店を記録」から始めてください。'}</div>`);
}

function drawCastChips(){
  const f=$('#vform');if(!f)return;const store=f.store.value.trim(),cur=splitList(f.casts.value),ct=splitList(f.tags.value.replace(/[#＃]/g,''));

async function saveVisit(f){
  const photos=[];
  for(const p of form.photos){if(p.data)await dbPut('photos',{id:p.id,data:p.data});photos.push({id:p.id,thumb:p.thumb})}
  for(const id of form.removed)await dbDel('photos',id);
  const old=visits.find(x=>x.id===form.id)||{};
  const v={...old,id:form.id||uid(),date:f.date.value,amount:Math.max(0,Math.round(+f.amount.value||0)),store:f.store.value.trim(),area:f.area.value.trim(),
    casts:splitList(f.casts.value),episode:f.episode.value.trim(),tags:splitList(f.tags.value.replace(/[#＃]/g,'')),photos,skip:f.skip.checked};
  await dbPut('visits',v);
  const i=visits.findIndex(x=>x.id===v.id);if(i>=0)visits[i]=v;else visits.push(v);
  if(form.planId){await dbDel('plans',form.planId);plans=plans.filter(p=>p.id!==form.planId)}

}

/* ---------- 予定・提案 ---------- */
function castStore(c){const m=new Map();visits.filter(v=>v.casts.includes(c)&&v.store).forEach(v=>m.set(v.store,(m.get(v.store)||0)+1));return[...m].sort((a,b)=>b[1]-a[1])[0]?.[0]||''}
// 手入力のイベント＋キャスト誕生日
function eventsIn(ym){const out=plans.filter(p=>p.type==='event'&&p.date.startsWith(ym)).map(p=>({...p}));
  for(const n of notes.values()){if(!n.id.startsWith('cast:')||!n.birthday||n.birthday.slice(0,2)!==ym.slice(5))continue;const c=n.id.slice(5);
    const date=`${ym}-${n.birthday.slice(3)}`;if(new Date(date+'T00:00:00').getMonth()+1!==+ym.slice(5))continue;
    out.push({id:'b:'+c,type:'event',auto:true,date,title:`${c} 誕生日`,cast:c,store:castStore(c)})}
  return out}
function buildPlan(){
  if(M.ev.length<3)return{short:M.ev.length};
  const pm=monthsList(4).slice(0,3),past=visits.filter(v=>pm.includes(v.date.slice(0,7)));
  const autoN=Math.max(1,Math.round(past.length/3)),autoB=Math.round(sum(past,v=>v.amount)/3/1000)*1000;
  const N=+conf.target||autoN,budget=+conf.budget||autoB||Infinity,ym=ui.planMonth,td=today();
  const avgCost=sum(visits,v=>v.amount)/visits.length;
  const stores=agg(visits.filter(v=>v.store),v=>[v.store]).map(o=>{
    const vs=visits.filter(v=>v.store===o.key).sort((a,b)=>b.date.localeCompare(a.date));
    const cast=agg(vs,v=>v.casts).map(c=>({key:c.key,s:M.sh(c.react,c.ev)*(note('cast:'+c.key).oshi?1.1:1)})).sort((a,b)=>b.s-a.s)[0];
    return{...o,s:M.est(M.store,o.key),cost:o.avg,last:vs[0].date,area:vs[0].area,cast:cast&&cast.key}});
  if(!stores.length)return{short:M.ev.length};
  const find=name=>stores.find(s=>s.key===name)||{key:name,s:M.g,cost:avgCost,ev:0,visits:0,per:null,area:'',cast:''};
  // すでに決まっている分（当月の来店実績・登録済みの予定）
  const done=visits.filter(v=>v.date.startsWith(ym)),fixed=plans.filter(p=>p.type==='plan'&&p.date.startsWith(ym)&&p.date>=td);
  let slots=N-done.length-fixed.length,rest=budget-sum(done,v=>v.amount)-sum(fixed,p=>+p.est||0);
  const taken=new Set([...done,...fixed].map(x=>x.date)),picks=[],cnt=new Map();
  [...done.map(v=>v.store),...fixed.map(p=>p.store)].forEach(s=>cnt.set(s,(cnt.get(s)||0)+1));
  const add=(s,o)=>{picks.push({s,...o});cnt.set(s.key,(cnt.get(s.key)||0)+1);rest-=s.cost;slots--};
  // 1) イベント・誕生日を優先
  for(const e of eventsIn(ym).sort((a,b)=>a.date.localeCompare(b.date))){if(slots<=0)break;if(!e.store||e.date<td||taken.has(e.date))continue;const s=find(e.store);if(s.cost>rest)continue;
    taken.add(e.date);add(s,{date:e.date,why:'event',title:e.title,cast:e.cast||s.cast})}
  // 2) 残りを期待反響で選ぶ
  const tight=budget<N*avgCost,greedy=[];
  const explore=slots>=3?stores.filter(s=>s.ev<2&&!cnt.get(s.key)).sort((a,b)=>a.visits-b.visits||a.last.localeCompare(b.last))[0]:null;
  while(slots>0){let best=null,bv=-1,ex=false;
    if(explore&&slots===1&&explore.cost<=rest&&!cnt.get(explore.key)){best=explore;ex=true}
    else for(const s of stores){if(s.cost>rest)continue;const val=s.s*Math.pow(.75,cnt.get(s.key)||0)/(tight?Math.max(s.cost,1):1);if(val>bv){bv=val;best=s}}
    if(!best)break;const o={why:ex?'explore':'score',cast:best.cast};add(best,o);greedy.push(picks[picks.length-1])}

  const wds=WD.map((_,i)=>M.est(M.wd,i)),[y,m]=ym.split('-').map(Number),days=new Date(y,m,0).getDate(),avail=[];
  for(let d=1;d<=days;d++){const s=`${ym}-${pad(d)}`;if(s>=td&&!taken.has(s)&&!conf.ngWd.includes(wdOf(s)))avail.push(s)}
  const n=Math.min(greedy.length,avail.length),dates=[];
  for(let i=0;i<n;i++){const sg=avail.slice(Math.floor(i*avail.length/n),Math.floor((i+1)*avail.length/n));dates.push(sg.reduce((a,s)=>wds[wdOf(s)]>wds[wdOf(a)]?s:a,sg[0]))}

}

async function addSample(){

  const S=[['サンプル店A','エリア1',['キャストあ','キャストい'],6000,60],['サンプル店B','エリア1',['キャストう'],12000,75],['サンプル店C','エリア2',['キャストえ','キャストお'],4000,30],['サンプル店D','エリア3',['キャストか'],8000,45]];
  const now=new Date();
  for(let i=0;i<34;i++){

    const k=i<2?3:Math.floor(rnd()*3),s=S[k],date=ymd(d),wk=[0,6].includes(d.getDay())?1.4:1,ev=rnd()<.25;
    const v={id:uid(),date,store:s[0],area:s[1],casts:[s[2][Math.floor(rnd()*s[2].length)]],amount:Math.round(s[3]*(.6+rnd()*.9)/500)*500,

    await dbPut('visits',v);

  }
  await load();render();toast('サンプルデータを追加しました');
}

  if(a==='rm-photo'){const[p]=form.photos.splice(+D.i,1);if(!p.data)form.removed.push(p.id);dirty=true;return drawFormThumbs()}
  if(a==='add-cast'){const f=$('#vform');f.casts.value=[...splitList(f.casts.value),D.c].join('、');dirty=true;return drawCastChips()}
  if(a==='add-tag'){const f=$('#vform');f.tags.value=[...splitList(f.tags.value),D.c].join('、');dirty=true;return drawCastChips()}
  if(a==='del-visit'){if(!confirm('この来店記録を削除しますか？'))return;
    const v=visits.find(x=>x.id===id),linked=posts.filter(p=>p.visitId===id);
    for(const p of linked){p.visitId='';await dbPut('posts',p)}
    await dbDel('visits',id);visits=visits.filter(x=>x.id!==id);closeDlg(true);render();
    // 写真は「元に戻す」の猶予が過ぎてから消す
    const purge=setTimeout(async()=>{for(const p of v.photos)await dbDel('photos',p.id)},7000);
    return toast('削除しました',async()=>{clearTimeout(purge);await dbPut('visits',v);visits.push(v);for(const p of linked){p.visitId=id;await dbPut('posts',p)}render()})}
  if(a==='skip'){const v=visits.find(x=>x.id===id);v.skip=true;await dbPut('visits',v);render();return toast('ネタ在庫から外しました',async()=>{v.skip=false;await dbPut('visits',v);render()})}
  if(a==='new-post')return openPost(null,id);
  if(a==='edit-post')return openPost(id);
  if(a==='del-post'){if(!confirm('この投稿を削除しますか？'))return;const p=posts.find(x=>x.id===id);await dbDel('posts',id);posts=posts.filter(x=>x.id!==id);closeDlg(true);render();
    return toast('削除しました',async()=>{await dbPut('posts',p);posts.push(p);render()})}
  if(a==='tpl'){const f=$('#pform'),v=visits.find(x=>x.id===f.visitId.value);if(!v)return toast('元になる来店を選んでください');
    const t=[[v.store,v.area&&`（${v.area}）`].filter(Boolean).join(''),v.casts.join('、'),'',v.episode,'',[...v.tags.map(t=>'#'+t),conf.hashtags].filter(Boolean).join(' ')].join('\n').replace(/\n{3,}/g,'\n\n').trim();
    f.text.value=f.text.value?f.text.value+'\n'+t:t;dirty=true;return countPost()}
  if(a==='copy'){try{await navigator.clipboard.writeText($('#pform').text.value);toast('コピーしました')}catch(_){toast('コピーできませんでした')}return}
  if(a==='share'){try{await navigator.share({text:$('#pform').text.value})}catch(_){}return}
  if(a==='xpost')return void window.open('https://x.com/intent/post?text='+encodeURIComponent($('#pform').text.value),'_blank','noopener');
  if(a==='mark-posted'){const f=$('#pform'),n=new Date();f.status.value='posted';if(!f.date.value)f.date.value=today();if(!f.time.value)f.time.value=`${pad(n.getHours())}:${pad(n.getMinutes())}`;dirty=true;return toast('投稿済みにしました。保存を押してください')}
  if(a==='vseg'){ui.vseg=D.k;return render()}
  if(a==='pseg'){ui.pseg=D.k;return render()}
  if(a==='range'){ui.range=D.k;return render()}
  if(a==='dim'){ui.dim=D.k;return render()}
  if(a==='tsort'){ui.tsort=D.k;return render()}
  if(a==='qf'){const f=ui.f,ym=today().slice(0,7);if(D.k==='month'){const on=f.from===ym&&f.to===ym;f.from=f.to=on?'':ym}else f[D.k]=!f[D.k];return render()}
  if(a==='unf'){ui.f[D.k]='';return render()}
  if(a==='ftag'){ui.f.tag=D.name;return go('visits',{vseg:'list'})}
  if(a==='clear-filter'){ui.f=F0();ui.q='';return render()}
  if(a==='ent')return openEntity(D.kind,D.name);
  if(a==='ent-list'){closeDlg(true);ui.f=F0();ui.q='';ui.f[D.kind]=D.name;return go('visits',{vseg:'list'})}
  if(a==='ent-plan')return openPlanForm('plan',today(),D.kind==='cast'?{cast:D.name,store:castStore(D.name)}:{store:D.name});
  if(a==='rename')return renameEntity(D.kind,D.name);
  if(a==='cal'){ui.cal=addMonth(ui.cal,+D.n);return render()}
  if(a==='day'){ui.day=D.d;ui.cal=D.d.slice(0,7);return render()}
  if(a==='new-plan')return openPlanForm('plan',D.d);
  if(a==='new-event')return openPlanForm('event',D.d);
  if(a==='del-plan'){const p=plans.find(x=>x.id===id);await dbDel('plans',id);plans=plans.filter(x=>x.id!==id);render();return toast('取り消しました',async()=>{await dbPut('plans',p);plans.push(p);render()})}
  if(a==='plan-rec'){const p=plans.find(x=>x.id===id);return openVisit(null,{date:p.date,store:p.store,area:p.area,casts:p.cast?[p.cast]:[],planId:p.id})}
  if(a==='ng'){const i=+D.i;conf.ngWd=conf.ngWd.includes(i)?conf.ngWd.filter(x=>x!==i):[...conf.ngWd,i];saveConf();return render()}
  if(a==='suggest'){ui.showPlan=true;render();return $('#proposal').scrollIntoView({behavior:'smooth',block:'start'})}
  if(a==='add-plan'){const p=lastPlan.picks[+D.i];await addPlan(p);ui.day=p.date;ui.cal=p.date.slice(0,7);render();return toast('予定に追加しました')}
  if(a==='add-plan-all'){for(const p of lastPlan.picks)await addPlan(p);ui.cal=ui.planMonth;render();scrollTo(0,0);return toast('すべて予定に追加しました')}
  if(a==='export')return exportAll();
  if(a==='csv')return exportCsv(D.k);
  if(a==='sample')return addSample();
  if(a==='wipe-sample'){if(!confirm('サンプルデータだけを削除します。よろしいですか？'))return;
    for(const v of visits.filter(v=>v.sample))await dbDel('visits',v.id);for(const p of posts.filter(p=>p.sample))await dbDel('posts',p.id);await load();render();return toast('サンプルを削除しました')}
  if(a==='wipe'){if(!confirm('すべての来店記録・投稿・予定・写真を削除します。元に戻せません。よろしいですか？'))return;
    for(const s of STORES)await dbClear(s);await load();render();return toast('削除しました')}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='vform')saveVisit(f);if(f.id==='pform')savePost(f);if(f.id==='plform')savePlanForm(f)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){ui.q=t.value;return drawVisitList()}
  if(t.name==='text'&&t.form?.id==='pform')return countPost();
  if(['store','casts','tags'].includes(t.name)&&t.form?.id==='vform')return drawCastChips();
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.f){ui.f[t.dataset.f]=t.value;return render()}
  if(t.id==='sort'){ui.sort=t.value;return drawVisitList()}
  if(t.name==='store'&&t.form?.id==='vform')return fillArea(t.form);
  if(t.name==='visitId')return drawPostVisit();
  if(t.id==='fphoto'){for(const file of t.files){try{const img=await loadImg(file);form.photos.push({id:uid(),thumb:shrink(img,240,.7),data:shrink(img,1280,.82)})}catch(_){toast('読み込めない画像がありました')}}t.value='';dirty=true;return drawFormThumbs()}
  if(t.dataset.note){const box=t.closest('[data-ent]'),n={...note(box.dataset.ent)},g=k=>$(`[data-note=${k}]`,box);
    n.memo=g('memo').value.trim();if(g('oshi')){n.oshi=g('oshi').checked;const bm=+g('bm').value,bd=+g('bd').value;n.birthday=bm>=1&&bm<=12&&bd>=1&&bd<=31?`${pad(bm)}-${pad(bd)}`:''}
    await saveNote(n);dirty=false;render();return toast('メモを保存しました')}
  if(t.id==='pl-month'&&t.value){ui.planMonth=t.value;return render()}
  if(t.id==='pl-n'){conf.target=t.value;saveConf();return render()}
  if(t.id==='pl-b'){conf.budget=t.value;saveConf();return render()}
  if(t.dataset.w){conf.w[t.dataset.w]=Math.max(0,+t.value||0);return saveConf()}
  if(t.id==='c-tags'){conf.hashtags=t.value.trim();return saveConf()}
  if(t.id==='imp'&&t.files[0]){await importAll(t.files[0]);t.value=''}
});

/* ---------- boot ---------- */
async function load(){visits=await dbAll('visits');posts=await dbAll('posts');plans=await dbAll('plans');notes=new Map((await dbAll('notes')).map(n=>[n.id,n]));
  visits.forEach(v=>{v.casts||=[];v.tags||=[];v.photos||=[];v.amount=+v.amount||0})}
(async()=>{try{db=await openDB();await load();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});render()}
  catch(err){console.error(err);$('#main').innerHTML=`<div class="empty">このブラウザではデータを保存できません（プライベートブラウズ等）。通常モードで開いてください。</div>`}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body>
</html>
